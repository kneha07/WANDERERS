# Keeps the SPHEREx data current (README: "Data (all public)" > "Keeping the SPHEREx data current").
#
# Every week, and when run by hand, it asks NASA IRSA which SPHEREx releases exist (pipeline/spherex_releases.py).
#   * A release newer than the one a prepared target was built from, or a run by hand with "rebuild": it re-runs
#     fetch.py and analyze.py (then gaia_facts.py, evidence.py and vet.py, which analyze.py's fresh target.json
#     needs) for the prepared targets and opens a pull request with the refreshed app/data.
#   * Only the status file changed (another release list, IRSA answering again after failed checks): a pull request
#     with app/data/spherex_release.json alone.
#   * Nothing changed, or IRSA is down: it does nothing (a manual rebuild also stops when IRSA cannot be asked).
# It never pushes to main: the bot pushes only its own branch, spherex-sync, and a person reviews and merges the PR.
# While that PR is open, scheduled runs do not rebuild again.
#
# Repository setting needed once: Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests". Pull requests opened with GITHUB_TOKEN do not start other workflows: close and reopen the PR to run
# the checks workflow on it.
name: spherex-sync

on:
  schedule:
    - cron: "23 7 * * 1"   # Mondays 07:23 UTC
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Re-run fetch.py and analyze.py for every prepared target, even when no new release appeared"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: spherex-sync
  cancel-in-progress: false

jobs:
  check:
    name: Ask IRSA which SPHEREx releases exist
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    outputs:
      new_release: ${{ steps.check.outputs.new_release }}
      changed: ${{ steps.check.outputs.changed }}
      online: ${{ steps.check.outputs.online }}
      open_pr: ${{ steps.open.outputs.open_pr }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - id: check
        name: Check releases (IRSA down is not an error; the last known file is kept)
        run: python pipeline/spherex_releases.py check --github-output "$GITHUB_OUTPUT"
      - id: open
        name: Is a sync pull request already open?
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head spherex-sync --state open --json number --jq length)
          if [ "${n:-0}" -gt 0 ]; then echo "open_pr=true" >> "$GITHUB_OUTPUT"; else echo "open_pr=false" >> "$GITHUB_OUTPUT"; fi

  update:
    name: Refresh app/data and open a pull request
    needs: check
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.rebuild) ||
      (needs.check.outputs.open_pr == 'false' &&
       (needs.check.outputs.new_release == 'true' || needs.check.outputs.changed == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 340     # a full rebuild downloads up to 150 SPHEREx cutouts per target, gently (3 at a time)
    permissions:
      contents: write        # push the spherex-sync branch (never main)
      pull-requests: write   # open the pull request
    env:
      REBUILD: ${{ (github.event_name == 'workflow_dispatch' && inputs.rebuild) || needs.check.outputs.new_release == 'true' }}
      BRANCH: spherex-sync
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - run: pip install -r pipeline/requirements.txt
      - name: Check releases again (fetch.py searches the releases this writes; stops here if IRSA is down)
        run: python pipeline/spherex_releases.py check --require-online
      - name: Rebuild the prepared targets
        if: env.REBUILD == 'true'
        run: |
          since=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ids=$(python pipeline/spherex_releases.py targets --write-defs)
          echo "prepared targets: $ids"
          python pipeline/fetch.py $ids
          python pipeline/analyze.py $ids
          python pipeline/gaia_facts.py $ids
          python pipeline/evidence.py
          python pipeline/vet.py
          python pipeline/spherex_releases.py synced --since "$since"
      - name: Open or update the pull request
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git add -- app/data ':!app/data/survey'
          if git diff --cached --quiet; then echo "app/data did not change: no pull request."; exit 0; fi
          title=$(python pipeline/spherex_releases.py show --title)
          {
            echo "Automatic SPHEREx data update by the spherex-sync workflow ([run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))."
            echo
            echo '```'
            python pipeline/spherex_releases.py show
            echo '```'
            echo
            if [ "$REBUILD" = "true" ]; then
              echo "Rebuilt with fetch.py, analyze.py, gaia_facts.py, evidence.py and vet.py. Not regenerated: explain.json (needs the Claude CLI) and trajectory.json."
            else
              echo "Only app/data/spherex_release.json changed; no target was rebuilt."
            fi
            echo
            echo "Check the frames and evidence cards before merging. Close and reopen this pull request to run the checks workflow on it."
          } > "$RUNNER_TEMP/pr-body.md"
          git switch -C "$BRANCH"
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "$title"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq length)
          if [ "${n:-0}" -eq 0 ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/pr-body.md"
          else
            echo "Updated the open pull request from $BRANCH."
          fi
