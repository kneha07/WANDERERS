# Publishes the static site (app/) to GitHub Pages every time main changes, so a merged pull request is live a minute
# or two later with no copying by hand. The site is served at https://kneha07.github.io/WANDERERS/.
#
# One-time setup (a repository admin): Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Until that is set, the deploy step fails with "Pages site not found" and nothing else is affected.
#
# Triggers:
#  - a push to main (every merged pull request);
#  - the "classifications" workflow finishing: it commits new vote counts to main with GITHUB_TOKEN, and pushes made
#    with that token do not start other workflows, so its completion is the signal instead;
#  - by hand (Actions → pages → Run workflow);
#  - a pull request that touches app/ or this file: it only builds and checks the Pages bundle (no deploy), so a PR
#    shows before merging that the site packs and its entry pages are in it.
# Only app/ is published: no pipeline, backend, tests or secrets. app/ is plain static files (no build step).
name: pages
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [classifications]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths: ["app/**", ".github/workflows/pages.yml"]
permissions:
  contents: read
concurrency:
  # deploys queue one after another and are never stopped half-way; a PR's check runs in its own group, so it can
  # never replace a waiting deploy
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the Pages bundle (app/)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        # workflow_run would otherwise check out the commit before the vote update; a PR checks its own commit
        with: { ref: "${{ github.event_name == 'pull_request' && github.sha || 'main' }}" }
      - name: Check the site's entry pages are in app/
        run: for f in index.html observatory.html compass.html stories.html survey.html sw.js data/index.json; do test -s "app/$f" || { echo "missing app/$f"; exit 1; }; done
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: app }

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
